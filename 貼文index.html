<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貼文產生器</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --text:#1f2430; --muted:#6b7280;
    --border:#e3e6ee; --primary:#5b5bf0; --primary-text:#ffffff;
    --danger:#e5484d; --ok:#16a34a; --shadow:0 2px 10px rgba(20,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141a; --card:#1b1e27; --text:#e8eaf0; --muted:#9aa1b2;
      --border:#2c303c; --primary:#7c7cff; --primary-text:#10121a;
      --danger:#ff6b70; --ok:#4ade80; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  .grid{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
  label:first-child{margin-top:0}
  input[type=text],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
    background:var(--bg);color:var(--text);font:inherit;font-size:.95rem}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px}
  textarea{resize:vertical;min-height:90px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;pointer-events:none}
  .chip span{display:inline-block;padding:6px 14px;border:1px solid var(--border);border-radius:999px;
    cursor:pointer;font-size:.9rem;background:var(--bg);user-select:none}
  .chip input:checked + span{background:var(--primary);color:var(--primary-text);border-color:var(--primary)}
  .chip input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
  .row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.95rem}
  .row input{width:18px;height:18px}
  .btns{display:flex;gap:10px;margin-top:20px}
  button{font:inherit;cursor:pointer;border-radius:10px;padding:10px 16px;border:1px solid var(--border);
    background:var(--card);color:var(--text)}
  button:hover{border-color:var(--primary)}
  button.primary{background:var(--primary);color:var(--primary-text);border-color:var(--primary);font-weight:600;flex:1}
  .results{display:flex;flex-direction:column;gap:16px}
  .empty{color:var(--muted);text-align:center;padding:48px 12px}
  .post{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.85rem;color:var(--muted)}
  .post textarea{min-height:140px;background:transparent;border:1px dashed var(--border);line-height:1.7}
  .post-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
  .count{font-size:.85rem;color:var(--muted)}
  .count.over{color:var(--danger);font-weight:600}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);
    padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;font-size:.92rem;z-index:10}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .hint{font-size:.8rem;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>✍️ 貼文產生器</h1>
  <p class="sub">輸入主題與重點,一次產生 3 則不同風格的貼文,可直接編輯並複製。</p>

  <div class="grid">
    <!-- 左側:設定 -->
    <section class="panel" aria-label="貼文設定">
      <label for="topic">主題 *</label>
      <input type="text" id="topic" placeholder="例如:週末咖啡市集">

      <label for="points">重點(一行一個,可留空)</label>
      <textarea id="points" placeholder="例如:&#10;30 組在地攤位&#10;現場手沖體驗&#10;早鳥入場送杯套"></textarea>

      <label>平台</label>
      <div class="chips" id="platform">
        <label class="chip"><input type="radio" name="platform" value="ig" checked><span>Instagram</span></label>
        <label class="chip"><input type="radio" name="platform" value="fb"><span>Facebook</span></label>
        <label class="chip"><input type="radio" name="platform" value="th"><span>Threads</span></label>
        <label class="chip"><input type="radio" name="platform" value="x"><span>X</span></label>
        <label class="chip"><input type="radio" name="platform" value="li"><span>LinkedIn</span></label>
      </div>

      <label>語氣</label>
      <div class="chips" id="tone">
        <label class="chip"><input type="radio" name="tone" value="friendly" checked><span>親切</span></label>
        <label class="chip"><input type="radio" name="tone" value="pro"><span>專業</span></label>
        <label class="chip"><input type="radio" name="tone" value="funny"><span>幽默</span></label>
        <label class="chip"><input type="radio" name="tone" value="inspire"><span>勵志</span></label>
        <label class="chip"><input type="radio" name="tone" value="promo"><span>促銷</span></label>
      </div>

      <label>長度</label>
      <div class="chips" id="length">
        <label class="chip"><input type="radio" name="length" value="short"><span>短</span></label>
        <label class="chip"><input type="radio" name="length" value="mid" checked><span>中</span></label>
        <label class="chip"><input type="radio" name="length" value="long"><span>長</span></label>
      </div>

      <label for="cta">行動呼籲(留空則自動產生)</label>
      <input type="text" id="cta" placeholder="例如:點連結立即報名">

      <label for="tags">自訂標籤(空白或逗號分隔)</label>
      <input type="text" id="tags" placeholder="例如:咖啡 市集 週末去哪">

      <label for="sign">署名(選填)</label>
      <input type="text" id="sign" placeholder="例如:小森咖啡">

      <div class="row">
        <input type="checkbox" id="emoji" checked>
        <label for="emoji" style="margin:0;font-weight:400">使用表情符號</label>
      </div>
      <div class="row">
        <input type="checkbox" id="hashtag" checked>
        <label for="hashtag" style="margin:0;font-weight:400">加上 Hashtag</label>
      </div>

      <div class="btns">
        <button class="primary" id="genBtn" type="button">✨ 產生貼文</button>
        <button id="resetBtn" type="button">清除</button>
      </div>
      <div class="hint" id="formHint" role="alert"></div>
    </section>

    <!-- 右側:結果 -->
    <section class="results" id="results" aria-live="polite">
      <div class="empty">填好左側欄位,按下「產生貼文」</div>
    </section>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var val = function(name){ var el = document.querySelector('input[name="'+name+'"]:checked'); return el ? el.value : ''; };

  var PLAT = {
    ig:{name:'Instagram', max:2200,  tags:8, maxPoints:6},
    fb:{name:'Facebook',  max:63206, tags:3, maxPoints:6},
    th:{name:'Threads',   max:500,   tags:1, maxPoints:3},
    x: {name:'X',         max:280,   tags:2, maxPoints:2},
    li:{name:'LinkedIn',  max:3000,  tags:4, maxPoints:6}
  };

  var TONE = {
    friendly:{
      emo:['😊','🌟','💬','☕'],
      hooks:['最近一直在想「{t}」,跟你們聊聊!','關於「{t}」,我想跟你分享一件小事~','今天想來聊聊「{t}」,你有過類似的感覺嗎?'],
      intro:['先說重點,「{t}」真的值得你花幾分鐘看看。','如果你也對「{t}」有興趣,這篇送給你。'],
      close:['希望對你有幫助,我們下次見!','如果你也有同感,讓我知道吧~'],
      cta:'留言分享你的想法,我都會看!'
    },
    pro:{
      emo:['📊','💡','📌','🔎'],
      hooks:['【{t}】你需要知道的幾件事','深入解析「{t}」:重點整理','關於「{t}」,以下是我們的觀察與建議'],
      intro:['以下針對「{t}」整理出關鍵資訊。','「{t}」近期備受關注,我們彙整了幾個重點。'],
      close:['以上整理,供你參考。','掌握這些重點,能讓你少走許多彎路。'],
      cta:'歡迎留言交流,或私訊了解更多。'
    },
    funny:{
      emo:['😂','🤣','🙈','🔥'],
      hooks:['誰懂啊!「{t}」真的太有事了','「{t}」:我以為我懂了,結果…','先說,「{t}」這件事我可以講三天三夜'],
      intro:['事情是這樣的,說來話長但我盡量短。','我保證這篇比你的週一會議有趣。'],
      close:['好啦我講完了,換你!','不好笑的話,就當我沒說過。'],
      cta:'覺得好笑的,tag 一個朋友一起看!'
    },
    inspire:{
      emo:['🌱','💪','✨','🚀'],
      hooks:['別小看「{t}」,它可能改變你的下一步','每一次關於「{t}」的嘗試,都是在靠近更好的自己','從「{t}」開始,今天就踏出第一步'],
      intro:['不是等準備好才開始,而是開始了才會準備好。','改變不需要很大,只要從今天開始。'],
      close:['記住:開始,永遠不嫌晚。','慢慢來,但請不要停下來。'],
      cta:'把這則存起來,給未來的自己一點力量。'
    },
    promo:{
      emo:['🔥','🎉','🛍️','⏰'],
      hooks:['限時登場|{t}','終於等到!「{t}」現在就能入手','「{t}」重磅登場,錯過就要再等!'],
      intro:['這次我們準備了滿滿的誠意,先看重點:','準備好了嗎?亮點一次告訴你:'],
      close:['數量有限,動作要快!','現在行動,享受專屬優惠。'],
      cta:'立即點擊連結或私訊我們,把握優惠!'
    }
  };

  var BULLETS = ['✅','✨','📌','👉','🔸','💫'];

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function fill(s, t){ return s.replace(/\{t\}/g, t); }

  function buildTags(topic, custom, limit){
    var list = [];
    var topicTag = topic.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,'');
    custom.split(/[\s,,、#]+/).forEach(function(x){ if(x) list.push(x); });
    if(topicTag) list.push(topicTag);
    var seen = {}, out = [];
    list.forEach(function(x){ var k = x.toLowerCase(); if(!seen[k]){ seen[k]=1; out.push(x); } });
    return out.slice(0, limit).map(function(x){ return '#'+x; }).join(' ');
  }

  function build(cfg, hookIdx, order){
    var P = PLAT[cfg.platform], T = TONE[cfg.tone];
    var hooks = order.hooks, intros = order.intros, closes = order.closes;
    var emoOn = cfg.emoji;
    var e = function(i){ return emoOn ? T.emo[i % T.emo.length] : ''; };

    var hook = fill(hooks[hookIdx % hooks.length], cfg.topic);
    var head = (emoOn ? e(hookIdx) + ' ' : '') + hook;
    var parts = [head];

    var pts = cfg.points.slice(0, P.maxPoints);
    if(cfg.length === 'long'){ parts.push(fill(intros[hookIdx % intros.length], cfg.topic)); }
    if(cfg.length !== 'short' && pts.length){
      parts.push(pts.map(function(p,i){ return (emoOn ? BULLETS[(i+hookIdx) % BULLETS.length] : '•') + ' ' + p; }).join('\n'));
    }
    if(cfg.length === 'long'){ parts.push(closes[hookIdx % closes.length]); }

    var cta = cfg.cta || T.cta;
    parts.push((emoOn ? '👉 ' : '') + cta);

    if(cfg.sign){ parts.push('—— ' + cfg.sign); }
    if(cfg.hashtag){
      var tg = buildTags(cfg.topic, cfg.tags, P.tags);
      if(tg) parts.push(tg);
    }
    return parts.join('\n\n');
  }

  function readCfg(){
    return {
      topic: $('#topic').value.trim(),
      points: $('#points').value.split('\n').map(function(s){return s.trim();}).filter(Boolean),
      platform: val('platform'),
      tone: val('tone'),
      length: val('length'),
      cta: $('#cta').value.trim(),
      tags: $('#tags').value.trim(),
      sign: $('#sign').value.trim(),
      emoji: $('#emoji').checked,
      hashtag: $('#hashtag').checked
    };
  }

  var toastTimer;
  function toast(msg){
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function copyText(text, done){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      done(ok);
    }
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback);
    } else { fallback(); }
  }

  function autosize(ta){ ta.style.height='auto'; ta.style.height = Math.max(140, ta.scrollHeight+4)+'px'; }

  function updateCount(ta, countEl, max){
    var n = Array.from(ta.value).length;
    countEl.textContent = n + ' / ' + max + ' 字';
    countEl.classList.toggle('over', n > max);
  }

  function render(cfg){
    var box = $('#results');
    box.innerHTML = '';
    var T = TONE[cfg.tone], P = PLAT[cfg.platform];
    var order = { hooks: shuffle(T.hooks), intros: shuffle(T.intros), closes: shuffle(T.close) };

    for(var i=0;i<3;i++){
      (function(i){
        var text = build(cfg, i, order);
        var card = document.createElement('article');
        card.className = 'post';
        card.innerHTML =
          '<div class="post-head"><span>版本 ' + (i+1) + ' · ' + P.name + '</span></div>' +
          '<textarea aria-label="貼文內容 ' + (i+1) + '"></textarea>' +
          '<div class="post-foot"><span class="count"></span><button type="button">📋 複製</button></div>';
        var ta = card.querySelector('textarea');
        var cnt = card.querySelector('.count');
        var btn = card.querySelector('button');
        ta.value = text;
        ta.addEventListener('input', function(){ autosize(ta); updateCount(ta, cnt, P.max); });
        btn.addEventListener('click', function(){
          copyText(ta.value, function(ok){ toast(ok ? '已複製到剪貼簿 ✅' : '複製失敗,請手動選取文字'); });
        });
        box.appendChild(card);
        autosize(ta);
        updateCount(ta, cnt, P.max);
      })(i);
    }
  }

  function generate(){
    var cfg = readCfg();
    var hint = $('#formHint');
    if(!cfg.topic){
      hint.style.color = 'var(--danger)';
      hint.textContent = '請先輸入主題。';
      $('#topic').focus();
      return;
    }
    hint.textContent = '';
    render(cfg);
  }

  function reset(){
    ['#topic','#points','#cta','#tags','#sign'].forEach(function(s){ $(s).value=''; });
    $('#emoji').checked = true; $('#hashtag').checked = true;
    document.querySelector('input[name="platform"][value="ig"]').checked = true;
    document.querySelector('input[name="tone"][value="friendly"]').checked = true;
    document.querySelector('input[name="length"][value="mid"]').checked = true;
    $('#formHint').textContent = '';
    $('#results').innerHTML = '<div class="empty">填好左側欄位,按下「產生貼文」</div>';
    $('#topic').focus();
  }

  $('#genBtn').addEventListener('click', generate);
  $('#resetBtn').addEventListener('click', reset);
  $('#topic').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ generate(); } });

  // 預設範例,讓第一次開啟就能看到效果
  $('#topic').value = '週末咖啡市集';
  $('#points').value = '30 組在地攤位\n現場手沖體驗\n早鳥入場送杯套';
  $('#tags').value = '咖啡 週末去哪';
  $('#sign').value = '小森咖啡';
  generate();
})();
</script>
</body>
</html>
