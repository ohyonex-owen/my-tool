<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匯率計算機</title>
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #1b2333;
    --muted: #6b7587;
    --line: #e1e6ef;
    --accent: #2f6df6;
    --accent-soft: #e8efff;
    --ok: #1a8a4a;
    --warn: #b7791f;
    --err: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141d;
      --card: #182030;
      --text: #e8ecf4;
      --muted: #93a0b8;
      --line: #28324a;
      --accent: #6c9bff;
      --accent-soft: #223056;
      --ok: #4cc27f;
      --warn: #e0b25a;
      --err: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,.05);
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #amount { font-size: 24px; font-weight: 600; }
  .row { display: flex; align-items: flex-end; gap: 10px; margin-top: 16px; }
  .row > div { flex: 1; min-width: 0; }
  .swap {
    flex: 0 0 auto;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
  }
  .swap:hover { border-color: var(--accent); }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    background: var(--accent-soft);
  }
  .result .from { font-size: 14px; color: var(--muted); }
  .result .to { font-size: 30px; font-weight: 700; word-break: break-all; }
  .result .rate { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 20px; }
  .msg.ok { color: var(--ok); }
  .msg.warn { color: var(--warn); }
  .msg.err { color: var(--err); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; }
  .btn {
    font: inherit; font-size: 13px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: wait; }
  h2 { font-size: 15px; margin: 24px 0 10px; color: var(--muted); font-weight: 600; }
  .list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  .item {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    font-size: 14px;
  }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--accent-soft); }
  .item .name { color: var(--muted); }
  .item .val { font-weight: 600; text-align: right; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💱 匯率計算機</h1>

  <div class="card">
    <label for="amount">金額</label>
    <input id="amount" type="text" inputmode="decimal" value="1000" autocomplete="off">

    <div class="row">
      <div>
        <label for="from">從</label>
        <select id="from"></select>
      </div>
      <button class="swap" id="swap" type="button" title="互換幣別" aria-label="互換幣別">⇄</button>
      <div>
        <label for="to">轉成</label>
        <select id="to"></select>
      </div>
    </div>

    <div class="result" aria-live="polite">
      <div class="from" id="resFrom">—</div>
      <div class="to" id="resTo">—</div>
      <div class="rate" id="resRate"></div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="bar">
      <span id="updated" style="font-size:12px;color:var(--muted)"></span>
      <button class="btn" id="refresh" type="button">更新匯率</button>
    </div>
  </div>

  <h2>同金額換成其他幣別(點一下可切換目標)</h2>
  <div class="list" id="list"></div>

  <div class="foot">匯率僅供參考,實際交易以銀行或平台報價為準。</div>
</div>

<script>
(function () {
  // 幣別清單
  var CURRENCIES = [
    ["TWD", "新台幣"], ["USD", "美元"], ["JPY", "日圓"], ["EUR", "歐元"],
    ["CNY", "人民幣"], ["HKD", "港幣"], ["KRW", "韓元"], ["GBP", "英鎊"],
    ["AUD", "澳幣"], ["CAD", "加幣"], ["SGD", "新加坡幣"], ["THB", "泰銖"],
    ["VND", "越南盾"], ["MYR", "馬來西亞令吉"], ["PHP", "菲律賓披索"],
    ["IDR", "印尼盾"], ["NZD", "紐西蘭幣"], ["CHF", "瑞士法郎"], ["INR", "印度盧比"]
  ];

  // 離線備用匯率(以 1 USD 為基準,僅為大略參考值)
  var FALLBACK = {
    USD: 1, TWD: 32, JPY: 150, EUR: 0.92, CNY: 7.2, HKD: 7.8, KRW: 1350,
    GBP: 0.78, AUD: 1.5, CAD: 1.36, SGD: 1.34, THB: 35, VND: 25000,
    MYR: 4.5, PHP: 56, IDR: 15800, NZD: 1.64, CHF: 0.88, INR: 83
  };

  var API_URL = "https://open.er-api.com/v6/latest/USD";
  var STORE_KEY = "fx_calc_v1";

  var rates = Object.assign({}, FALLBACK);
  var source = "fallback";   // fallback | cache | live
  var updatedAt = null;

  var elAmount = document.getElementById("amount");
  var elFrom = document.getElementById("from");
  var elTo = document.getElementById("to");
  var elSwap = document.getElementById("swap");
  var elResFrom = document.getElementById("resFrom");
  var elResTo = document.getElementById("resTo");
  var elResRate = document.getElementById("resRate");
  var elMsg = document.getElementById("msg");
  var elUpdated = document.getElementById("updated");
  var elRefresh = document.getElementById("refresh");
  var elList = document.getElementById("list");

  // ---------- 儲存(失效時不影響使用) ----------
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }

  // ---------- 工具 ----------
  function setMsg(text, type) {
    elMsg.textContent = text || "";
    elMsg.className = "msg" + (type ? " " + type : "");
  }

  function parseAmount(str) {
    var s = String(str).replace(/[,\s]/g, "");
    if (s === "" || !/^\d*\.?\d*$/.test(s) || s === ".") return NaN;
    return parseFloat(s);
  }

  function fmt(n, code) {
    var digits = 2;
    if (code === "JPY" || code === "KRW" || code === "VND" || code === "IDR") digits = 0;
    if (Math.abs(n) < 1 && n !== 0) digits = Math.max(digits, 4);
    return new Intl.NumberFormat("zh-TW", {
      minimumFractionDigits: digits === 0 ? 0 : Math.min(2, digits),
      maximumFractionDigits: digits
    }).format(n);
  }

  function fmtRate(n) {
    var d = n >= 100 ? 2 : n >= 1 ? 4 : 6;
    return new Intl.NumberFormat("zh-TW", { maximumFractionDigits: d }).format(n);
  }

  function nameOf(code) {
    for (var i = 0; i < CURRENCIES.length; i++) if (CURRENCIES[i][0] === code) return CURRENCIES[i][1];
    return code;
  }

  function convert(amount, from, to) {
    return amount / rates[from] * rates[to];
  }

  // ---------- 畫面 ----------
  function fillSelects() {
    var html = CURRENCIES.map(function (c) {
      return '<option value="' + c[0] + '">' + c[0] + " " + c[1] + "</option>";
    }).join("");
    elFrom.innerHTML = html;
    elTo.innerHTML = html;
    var saved = load("fx_pair") || {};
    elFrom.value = saved.from || "TWD";
    elTo.value = saved.to || "USD";
  }

  function render() {
    var from = elFrom.value, to = elTo.value;
    var amount = parseAmount(elAmount.value);
    save("fx_pair", { from: from, to: to });

    var unit = rates[to] / rates[from];
    elResRate.textContent = "1 " + from + " = " + fmtRate(unit) + " " + to;

    if (isNaN(amount)) {
      elResFrom.textContent = "請輸入有效的數字";
      elResTo.textContent = "—";
      elList.innerHTML = "";
      return;
    }

    var out = convert(amount, from, to);
    elResFrom.textContent = fmt(amount, from) + " " + from + "(" + nameOf(from) + ") =";
    elResTo.textContent = fmt(out, to) + " " + to;

    elList.innerHTML = CURRENCIES
      .filter(function (c) { return c[0] !== from; })
      .map(function (c) {
        var v = convert(amount, from, c[0]);
        return '<div class="item" data-code="' + c[0] + '">' +
          '<span><b>' + c[0] + '</b> <span class="name">' + c[1] + '</span></span>' +
          '<span class="val">' + fmt(v, c[0]) + '</span></div>';
      }).join("");
  }

  function renderStatus() {
    if (source === "live") {
      setMsg("已取得最新匯率", "ok");
    } else if (source === "cache") {
      setMsg("目前使用上次儲存的匯率(網路更新失敗)", "warn");
    } else {
      setMsg("目前使用內建的大略參考匯率,請按「更新匯率」取得即時資料", "warn");
    }
    elUpdated.textContent = updatedAt ? "更新時間:" + new Date(updatedAt).toLocaleString("zh-TW") : "尚未取得即時匯率";
  }

  // ---------- 取得匯率 ----------
  function fetchRates() {
    elRefresh.disabled = true;
    setMsg("更新中…", "");

    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 10000) : null;

    fetch(API_URL, ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || data.result !== "success" || !data.rates) throw new Error("格式錯誤");
        var next = {};
        CURRENCIES.forEach(function (c) {
          if (typeof data.rates[c[0]] === "number") next[c[0]] = data.rates[c[0]];
        });
        next.USD = 1;
        rates = Object.assign({}, FALLBACK, next);
        source = "live";
        updatedAt = Date.now();
        save(STORE_KEY, { rates: rates, updatedAt: updatedAt });
        renderStatus();
        render();
      })
      .catch(function () {
        if (source !== "live") {
          renderStatus();
        }
        setMsg(
          source === "cache"
            ? "更新失敗,暫時使用上次儲存的匯率"
            : "無法連線取得即時匯率,暫時使用內建參考匯率",
          "err"
        );
      })
      .then(function () {
        if (timer) clearTimeout(timer);
        elRefresh.disabled = false;
      });
  }

  // ---------- 事件 ----------
  elAmount.addEventListener("input", render);
  elFrom.addEventListener("change", render);
  elTo.addEventListener("change", render);

  elSwap.addEventListener("click", function () {
    var t = elFrom.value;
    elFrom.value = elTo.value;
    elTo.value = t;
    render();
  });

  elRefresh.addEventListener("click", fetchRates);

  elList.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest(".item") : null;
    if (!el) return;
    elTo.value = el.getAttribute("data-code");
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ---------- 啟動 ----------
  fillSelects();
  var cached = load(STORE_KEY);
  if (cached && cached.rates) {
    rates = Object.assign({}, FALLBACK, cached.rates);
    updatedAt = cached.updatedAt;
    source = "cache";
  }
  renderStatus();
  render();
  fetchRates();
})();
</script>
</body>
</html>
